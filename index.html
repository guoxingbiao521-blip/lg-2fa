<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LG-筑梦电子 2FA 验证中心</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/otpauth/9.2.2/otpauth.umd.min.js"></script>
    <style>
        :root {
            /* 明亮科技风配色 */
            --rose-main: #ff0055;
            --rose-light: #ff6699;
            --rose-dark: #b3003b;
            --rose-bg: rgba(255, 0, 85, 0.05);
            --bg-page: #f4f6f9; 
            --panel-bg: rgba(255, 255, 255, 0.85); 
            
            --text-dark: #1a1a1a;
            --text-gray: #666666;
            --border-light: rgba(255, 0, 85, 0.2);
            --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.05);
            --glow-rose: 0 0 15px rgba(255, 0, 85, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; }

        body {
            background-color: var(--bg-page);
            background-image: 
                linear-gradient(rgba(255,0,85,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,0,85,0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before, body::after {
            content: ''; position: absolute; background: radial-gradient(circle, rgba(255,0,85,0.1) 0%, transparent 70%); z-index: -1;
        }
        body::before { top: -10%; left: -10%; width: 500px; height: 500px; }
        body::after { bottom: 10%; right: -5%; width: 400px; height: 400px; }

        .container {
            width: 100%;
            max-width: 850px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            z-index: 1;
        }

        /* 顶部标题 - 居中 + 超强立体发光字 */
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 20px;
            margin-bottom: 20px;
            margin-top: 10px;
        }
        .header-icon {
            width: 50px; height: 50px;
            background: var(--rose-main);
            color: white;
            display: flex; justify-content: center; align-items: center;
            font-weight: 900; font-size: 24px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
            flex-shrink: 0;
        }
        .header-text h1 { 
            font-size: 3.2rem;
            color: #ffffff;
            font-weight: 900; 
            letter-spacing: 4px;
            text-shadow: 
                1px 1px 0px var(--rose-light),
                2px 2px 0px var(--rose-main),
                3px 3px 0px var(--rose-main),
                4px 4px 0px var(--rose-dark),
                5px 5px 0px var(--rose-dark),
                6px 6px 10px rgba(0,0,0,0.4),
                0 0 25px rgba(255, 0, 85, 0.8);
            line-height: 1;
            margin-bottom: 5px;
        }
        .header-text p { 
            font-size: 1rem; 
            color: var(--rose-main); 
            font-weight: bold;
            letter-spacing: 4px; 
            background: var(--rose-bg);
            display: inline-block;
            padding: 4px 12px;
            border-radius: 4px;
        }

        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 25px;
            box-shadow: var(--shadow-soft);
            position: relative;
        }

        .input-section {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .input-section input {
            flex: 1;
            padding: 16px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            color: var(--text-dark);
            background: rgba(255, 255, 255, 0.9);
            transition: 0.3s;
            outline: none;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .input-section input:focus, .modal-input:focus {
            border-color: var(--rose-main);
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.1);
        }
        
        .btn-generate {
            background: var(--rose-main);
            color: white;
            border: none;
            padding: 16px 30px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: var(--glow-rose);
            white-space: nowrap;
        }
        .btn-generate:hover { background: #e6004c; transform: translateY(-2px); box-shadow: 0 5px 20px rgba(255, 0, 85, 0.4); }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .code-container, .timer-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, #ffffff, #f9f9f9);
            border: 1px solid rgba(255,0,85,0.15);
            position: relative;
        }
        
        .decor-label {
            align-self: flex-start;
            font-size: 12px;
            color: var(--rose-main);
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 20px;
            background: var(--rose-bg);
            padding: 4px 10px;
            border-radius: 4px;
        }

        .totp-code {
            font-size: 3.8rem;
            font-weight: 900;
            color: var(--rose-main);
            letter-spacing: 12px;
            font-family: 'Impact', 'Arial Black', 'Segoe UI Black', sans-serif;
            text-shadow: 3px 3px 0px rgba(255,0,85,0.15);
            margin-bottom: 20px;
        }

        .btn-copy {
            background: transparent;
            color: var(--rose-main);
            border: 2px solid var(--rose-main);
            padding: 10px 25px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-copy:hover { background: var(--rose-main); color: white; box-shadow: var(--glow-rose); }

        .timer-container::before { content: ''; position: absolute; top: 10px; left: 10px; width: 15px; height: 15px; border-top: 2px solid var(--rose-light); border-left: 2px solid var(--rose-light); }
        .timer-container::after { content: ''; position: absolute; bottom: 10px; right: 10px; width: 15px; height: 15px; border-bottom: 2px solid var(--rose-light); border-right: 2px solid var(--rose-light); }
        
        .micro-data { position: absolute; font-size: 10px; color: #999; font-family: monospace; }
        .md-top-right { top: 15px; right: 15px; }
        .md-bottom-left { bottom: 15px; left: 15px; }

        .clock-wrapper { position: relative; width: 140px; height: 140px; display: flex; justify-content: center; align-items: center; }
        .radar-ring { position: absolute; width: 100%; height: 100%; border: 2px dashed rgba(255, 0, 85, 0.3); border-radius: 50%; animation: spin 8s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .progress-ring { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-90deg); }
        .progress-ring__circle_bg { stroke: #f0f0f0; }
        .progress-ring__circle { stroke: var(--rose-main); stroke-dasharray: 314; stroke-dashoffset: 0; transition: stroke-dashoffset 1s linear; }
        .clock-text { position: relative; font-size: 2.2rem; font-weight: 900; color: var(--text-dark); display: flex; flex-direction: column; align-items: center; line-height: 1; font-family: 'Impact', 'Arial Black', sans-serif; }
        .clock-text span { font-size: 10px; color: var(--rose-main); font-weight: bold; margin-top: 5px; font-family: sans-serif;}

        .history-header { margin-bottom: 15px; color: var(--text-dark); font-size: 1.2rem; font-weight: bold; border-left: 4px solid var(--rose-main); padding-left: 10px; }
        
        .history-item {
            background: white; border: 1px solid #eaeaea; padding: 15px 20px; border-radius: 8px; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center; transition: 0.3s;
        }
        .history-item:hover { border-color: var(--rose-light); box-shadow: 0 4px 15px rgba(255,0,85,0.08); transform: translateX(5px); }
        .history-name { font-weight: bold; font-size: 1rem; color: var(--text-dark); }
        .history-actions { display: flex; gap: 8px; }
        
        .history-actions button {
            background: #f8f8f8; border: 1px solid #ddd; color: var(--text-gray); padding: 8px 12px;
            font-size: 0.85rem; border-radius: 6px; cursor: pointer; transition: 0.2s; font-weight: bold;
        }
        .history-actions button:hover { background: white; border-color: var(--rose-main); color: var(--rose-main); }
        .history-actions .btn-use { background: var(--rose-bg); border-color: var(--rose-light); color: var(--rose-main); }
        .history-actions .btn-use:hover { background: var(--rose-main); color: white; }

        /* --- 全新升级：全局居中的 Q弹提示框 (Toast) --- */
        #toast {
            position: fixed; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%) scale(0.8); /* 初始缩小，准备弹射 */
            background: #ffffff; 
            color: var(--rose-main); 
            border: 2px solid var(--rose-main);
            padding: 16px 40px; 
            border-radius: 30px; 
            box-shadow: 0 15px 40px rgba(255,0,85,0.3); /* 更强烈的发光投影 */
            opacity: 0; 
            /* 丝滑的果冻回弹动效 */
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            pointer-events: none; 
            z-index: 3000; /* 最高层级 */
            font-weight: 900; 
            font-size: 1.1rem;
            letter-spacing: 1px;
            text-align: center;
        }
        #toast.show { 
            opacity: 1; 
            transform: translate(-50%, -50%) scale(1); /* 放大到正常尺寸 */
        }

        /* 独立弹窗组件 (Modal) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(244, 246, 249, 0.7); backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center;
            z-index: 2000; opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        
        .modal-box {
            background: #ffffff; border: 2px solid var(--border-light); border-radius: 16px;
            padding: 30px; width: 90%; max-width: 400px;
            box-shadow: 0 15px 50px rgba(255,0,85,0.15); text-align: center;
            transform: translateY(-20px); transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-overlay.active .modal-box { transform: translateY(0); }
        
        .modal-title { font-size: 1.2rem; font-weight: bold; color: var(--text-dark); margin-bottom: 20px; }
        .modal-input {
            width: 100%; padding: 14px; border: 2px solid #e0e0e0; border-radius: 8px;
            font-size: 1rem; color: var(--text-dark); margin-bottom: 25px; outline: none; transition: 0.3s;
            text-align: center; font-weight: bold;
        }
        .modal-actions { display: flex; gap: 15px; }
        .modal-btn {
            flex: 1; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 1rem;
            cursor: pointer; border: none; transition: 0.3s;
        }
        .modal-btn-cancel { background: #f0f0f0; color: var(--text-gray); }
        .modal-btn-cancel:hover { background: #e4e4e4; }
        .modal-btn-confirm { background: var(--rose-main); color: white; box-shadow: var(--glow-rose); }
        .modal-btn-confirm:hover { background: var(--rose-dark); }

        @media (max-width: 768px) {
            .dashboard { grid-template-columns: 1fr; }
            .history-item { flex-direction: column; align-items: flex-start; gap: 10px; }
            .history-actions { width: 100%; justify-content: flex-start; flex-wrap: wrap; }
            .header-text h1 { font-size: 2.2rem; }
            .header { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>

    <!-- 绝对居中的吐司提示框 -->
    <div id="toast">提示信息</div>

    <!-- 自定义独立弹窗 Modal -->
    <div class="modal-overlay" id="customModal">
        <div class="modal-box">
            <div class="modal-title" id="modalTitle">提示</div>
            <input type="text" id="modalInput" class="modal-input" autocomplete="off">
            <div class="modal-actions">
                <button class="modal-btn modal-btn-cancel" onclick="closeModal()">取消</button>
                <button class="modal-btn modal-btn-confirm" id="modalConfirmBtn">确定</button>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- 头部 LOGO 与标题 -->
        <div class="header">
            <div class="header-icon">LG</div>
            <div class="header-text">
                <h1>筑梦电子</h1>
                <p>2FA 验证码生成器</p>
            </div>
        </div>

        <div class="glass-panel input-section">
            <input type="text" id="secretInput" placeholder="请输入或粘贴您的 2FA 密钥 (Base32)" autocomplete="off">
            <button class="btn-generate" onclick="generateAndSave()">生成验证码</button>
        </div>

        <div class="dashboard">
            <div class="glass-panel code-container">
                <div class="decor-label">AUTH CODE // 动态口令</div>
                <div class="totp-code" id="totpCode">------</div>
                <button class="btn-copy" onclick="copyCode()">复制验证码</button>
            </div>

            <div class="glass-panel timer-container">
                <div class="decor-label" style="align-self: center; margin-bottom: 15px;">SYNC STATUS // 节点同步</div>
                <div class="micro-data md-top-right">PROTOCOL: TOTP<br>ALG: SHA-1</div>
                <div class="micro-data md-bottom-left">PERIOD: 30s<br>DIGITS: 6</div>
                <div class="clock-wrapper">
                    <div class="radar-ring"></div>
                    <svg class="progress-ring" width="120" height="120">
                        <circle class="progress-ring__circle_bg" stroke-width="8" fill="transparent" r="50" cx="60" cy="60"/>
                        <circle class="progress-ring__circle" id="clockRing" stroke-width="8" fill="transparent" r="50" cx="60" cy="60" stroke-linecap="round"/>
                    </svg>
                    <div class="clock-text">
                        <div id="timerText">30</div>
                        <span>SECONDS</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="glass-panel">
            <div class="history-header">历史使用记录</div>
            <div id="historyList"></div>
        </div>
    </div>

    <script>
        let currentSecret = "";
        let timerInterval = null;
        const CIRCUMFERENCE = 2 * Math.PI * 50; 

        // --- 自定义弹窗逻辑 ---
        let modalCallback = null;

        function showPrompt(title, defaultValue, callback) {
            document.getElementById('modalTitle').innerText = title;
            const inputEl = document.getElementById('modalInput');
            inputEl.style.display = 'block';
            inputEl.value = defaultValue;
            
            document.getElementById('customModal').classList.add('active');
            setTimeout(() => inputEl.focus(), 100);
            
            modalCallback = callback;
            document.getElementById('modalConfirmBtn').onclick = () => {
                const val = inputEl.value;
                closeModal();
                if (modalCallback) modalCallback(val);
            };
        }

        function showConfirm(title, callback) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalInput').style.display = 'none';
            document.getElementById('customModal').classList.add('active');
            
            modalCallback = callback;
            document.getElementById('modalConfirmBtn').onclick = () => {
                closeModal();
                if (modalCallback) modalCallback(true);
            };
        }

        function closeModal() {
            document.getElementById('customModal').classList.remove('active');
            modalCallback = null;
        }

        // -------------------------

        window.onload = () => {
            renderHistory();
            startTimer();
        };

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 2000);
        }

        function cleanSecret(secret) {
            return secret.replace(/\s+/g, '').toUpperCase();
        }

        function updateTOTP() {
            const codeEl = document.getElementById('totpCode');
            if (!currentSecret) {
                codeEl.innerText = "------";
                return;
            }
            try {
                let totp = new OTPAuth.TOTP({
                    algorithm: 'SHA1',
                    digits: 6,
                    period: 30,
                    secret: OTPAuth.Secret.fromBase32(currentSecret)
                });
                codeEl.innerText = totp.generate();
            } catch (e) {
                codeEl.innerText = "ERROR!";
                showToast("当前加载的密钥无效");
            }
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            
            const ringEl = document.getElementById('clockRing');
            const textEl = document.getElementById('timerText');

            timerInterval = setInterval(() => {
                const epoch = Math.floor(Date.now() / 1000);
                const remaining = 30 - (epoch % 30);
                
                textEl.innerText = remaining;
                
                const offset = CIRCUMFERENCE - (remaining / 30) * CIRCUMFERENCE;
                ringEl.style.strokeDashoffset = offset;

                if (remaining === 30 || document.getElementById('totpCode').innerText === "------") {
                    updateTOTP();
                }
            }, 1000);
            updateTOTP();
        }

        function copyCode() {
            const code = document.getElementById('totpCode').innerText;
            if (code && code !== "------" && code !== "ERROR!") {
                navigator.clipboard.writeText(code).then(() => showToast("验证码已复制到剪贴板！"));
            } else {
                showToast("没有可复制的有效验证码");
            }
        }

        function getHistory() {
            const data = localStorage.getItem('lg_2fa_history');
            return data ? JSON.parse(data) : [];
        }

        function saveHistory(history) {
            localStorage.setItem('lg_2fa_history', JSON.stringify(history));
            renderHistory();
        }

        function generateAndSave() {
            const rawSecret = document.getElementById('secretInput').value;
            const clean = cleanSecret(rawSecret);
            
            if (!clean) {
                showToast("请输入密钥");
                return;
            }
            
            try {
                OTPAuth.Secret.fromBase32(clean);
            } catch(e) {
                showToast("非法的 Base32 密钥格式，请检查");
                return;
            }

            currentSecret = clean;
            updateTOTP();
            
            let history = getHistory();
            const exists = history.find(h => h.secret === clean);
            
            if (!exists) {
                const defaultName = "账号 " + (history.length + 1);
                history.push({ id: Date.now().toString(), remark: defaultName, secret: clean });
                saveHistory(history);
            }
            
            document.getElementById('secretInput').value = ""; 
            showToast("生成成功");
        }

        function useAccount(secret) {
            currentSecret = secret;
            updateTOTP();
            showToast("已加载记录");
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function copySecret(secret) {
            navigator.clipboard.writeText(secret).then(() => showToast("密钥原文已复制！"));
        }

        function editRemark(id) {
            let history = getHistory();
            let index = history.findIndex(h => h.id === id);
            if (index > -1) {
                showPrompt("请输入新的账号备注名:", history[index].remark, (newRemark) => {
                    if (newRemark !== null && newRemark.trim() !== "") {
                        history[index].remark = newRemark.trim();
                        saveHistory(history);
                        showToast("备注已更新");
                    }
                });
            }
        }

        function deleteAccount(id) {
            showConfirm("确定要删除这条历史记录吗？", (confirmed) => {
                if (confirmed) {
                    let history = getHistory();
                    history = history.filter(h => h.id !== id);
                    saveHistory(history);
                    showToast("记录已删除");
                }
            });
        }

        function renderHistory() {
            const history = getHistory();
            const listEl = document.getElementById('historyList');
            listEl.innerHTML = "";

            if (history.length === 0) {
                listEl.innerHTML = "<div style='color: #999; text-align: center; padding: 20px 0;'>暂无历史使用记录</div>";
                return;
            }

            [...history].reverse().forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <div class="history-name">${item.remark}</div>
                    <div class="history-actions">
                        <button class="btn-use" onclick="useAccount('${item.secret}')">使用此记录</button>
                        <button onclick="copySecret('${item.secret}')">复制密钥</button>
                        <button onclick="editRemark('${item.id}')">修改备注</button>
                        <button onclick="deleteAccount('${item.id}')" style="color: #ff3333;">删除</button>
                    </div>
                `;
                listEl.appendChild(div);
            });
        }
    </script>
</body>
</html>
